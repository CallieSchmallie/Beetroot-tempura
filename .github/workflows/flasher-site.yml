# Builds Beetroot Tempura on a Windows runner and publishes a flasher page with
# the firmware built in to GitHub Pages. Open the Pages URL in Chrome or Edge
# (or Chrome on Android with USB-OTG), connect the FM-1 and press Install.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Build firmware and flasher site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install JieLi toolchain 2.5.3
        shell: pwsh
        timeout-minutes: 25
        run: |
          # Findings are reported as annotations so they show on the run page.
          function Note($m) { Write-Host "::notice::$m"; Write-Host $m }
          function Short($t, $n) { $t = ($t | Out-String) -replace '\s+', ' '; if ($t.Length -gt $n) { $t.Substring(0, $n) } else { $t } }
          $exe = "$env:RUNNER_TEMP\jl-2.5.3.exe"
          $t = Get-Date
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 900 --output $exe https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          if ($LASTEXITCODE -ne 0) { throw "Download of the JieLi installer failed (curl exit $LASTEXITCODE)." }
          $size = (Get-Item $exe).Length
          Note ("Downloaded installer: {0:N1} MB in {1:N0} s" -f ($size / 1MB), ((Get-Date) - $t).TotalSeconds)
          $head = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe), 0, [Math]::Min($size, 4MB))
          $kind = if ($head -match 'Inno Setup') { 'inno' } elseif ($head -match 'Nullsoft') { 'nsis' } elseif ($head -match '7-Zip|7zS') { '7z' } elseif ($head -match 'InstallShield') { 'installshield' } else { 'unknown' }
          Note "Installer type: $kind"

          function Find-Pi32($dirs) {
            foreach ($d in $dirs) {
              if (-not (Test-Path $d)) { continue }
              $c = Get-ChildItem -Path $d -Recurse -Filter clang.exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\pi32\\bin\\clang\.exe$' } | Select-Object -First 1
              if ($c) { return (Split-Path (Split-Path $c.FullName)) }
            }
            return $null
          }
          # 1. Inno Setup installer: unpack it with innoextract, nothing is run.
          $pi32 = $null
          try {
          $ie = "$env:RUNNER_TEMP\innoextract"
          curl.exe --fail --location --retry 3 --max-time 300 --output "$ie.zip" https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive "$ie.zip" $ie -Force
            $iex = (Get-ChildItem $ie -Recurse -Filter innoextract.exe | Select-Object -First 1).FullName
            $info = & $iex --info $exe 2>&1 | Out-String
            Note ("innoextract: " + (Short $info 400))
            $unpacked = "$env:RUNNER_TEMP\jl"
            $out = & $iex --extract --silent --output-dir $unpacked $exe 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Note ("innoextract failed: " + (Short $out 600)) }
            $pi32 = Find-Pi32 @($unpacked)
            if (-not $pi32 -and (Test-Path $unpacked)) {
              $dirs = (Get-ChildItem $unpacked -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { $_.FullName.Substring($unpacked.Length) }) -join ' | '
              Note "Extracted, but no pi32\bin\clang.exe. Folders: $dirs"
              # Nested archives inside the installer
              Get-ChildItem $unpacked -Recurse -Include *.7z,*.zip -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 5MB } | ForEach-Object {
                Note "Unpacking nested $($_.Name) ($([int]($_.Length/1MB)) MB)"
                & 7z x $_.FullName "-o$unpacked\nested" -y -bso0 -bsp0 | Out-Null
              }
              $pi32 = Find-Pi32 @("$unpacked\nested")
            }
          } else { Note 'Could not download innoextract' }
          } catch { Note ("innoextract step error: " + (Short $_ 600)) }

          # 2. Run the installer silently, with a hard time limit per attempt.
          if (-not $pi32) {
            $flags = switch ($kind) {
              'inno' { @("/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS /DIR=C:\JL /LOG=$env:RUNNER_TEMP\jl-setup.log") }
              'nsis' { @('/S /D=C:\JL') }
              default { @('/S', '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=C:\JL', '/quiet') }
            }
            foreach ($f in $flags) {
              Note "Running installer with: $f"
              $p = Start-Process -FilePath $exe -ArgumentList $f -PassThru
              if (-not $p.WaitForExit(300000)) {
                Note "Installer did not finish in 5 min with '$f' (probably waiting for a click); stopping it"
                Get-Process | Where-Object { $_.Path -like "$env:RUNNER_TEMP*" -or $_.Name -match 'jl|setup|install' } | Stop-Process -Force -ErrorAction SilentlyContinue
              }
              if (Test-Path "$env:RUNNER_TEMP\jl-setup.log") {
                $tail = (Get-Content "$env:RUNNER_TEMP\jl-setup.log" -Tail 12) -join ' / '
                Note "Setup log tail: $tail"
              }
              $pi32 = Find-Pi32 @('C:\JL', "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA")
              if ($pi32) { break }
            }
          }
          if (-not $pi32) { throw 'Could not install the JieLi toolchain unattended. See the notices above.' }
          Note "Toolchain found at $pi32"
          "FM1_PI32_TOOLCHAIN=$pi32" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build firmware
        shell: pwsh
        # Build.ps1 verifies every toolchain file against sdk/manifest.json
        # and checks SRAM, heap, BLE and USB linkage before packaging.
        run: ./sdk/Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN

      - name: Check memory and audio code placement
        shell: pwsh
        run: |
          & "$env:FM1_PI32_TOOLCHAIN\bin\llvm-nm.exe" --print-size build/dx7/sdk.elf | Out-File -Encoding utf8 build/dx7/nm.txt
          python tools/ci/check_memory.py build/dx7/nm.txt

      - name: Report largest code on failure
        if: failure()
        shell: pwsh
        run: python tools/ci/map_sizes.py build/dx7/sdk.map

      - name: Make the flasher site
        shell: pwsh
        run: |
          python tools/flasher/make_flasher.py --firmware build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc --identity build/dx7/build-identity.json --out site/index.html
          Copy-Item simulator/beetroot-tempura.html site/simulator.html
          Copy-Item build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc site/beetroot-tempura.fwsc
          Copy-Item build/dx7/build-identity.json site/build-identity.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
